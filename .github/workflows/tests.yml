name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check sw.js && find src scripts server tests -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Check repository integrity
        run: npm run check
      - name: Run logic tests
        run: npm test
  simulation:
    name: School simulation and scale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-simulation-evidence
          path: qa/
          retention-days: 7
  browser:
    name: Browser ${{ matrix.shard }} / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: core, engine: chromium }
          - { shard: circulation, engine: chromium }
          - { shard: cataloging, engine: chromium }
          - { shard: institutional, engine: chromium }
          - { shard: interoperability, engine: chromium }
          - { shard: field, engine: chromium }
          - { shard: compatibility, engine: firefox }
          - { shard: compatibility, engine: webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.1-${{ matrix.engine }}-ubuntu
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run shard
        run: npm run test:shard -- ${{ matrix.shard }}
        env:
          BROWSER_CHANNEL: chromium
          TEST_ENGINE: ${{ matrix.engine }}
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-pilot-${{ matrix.shard }}-${{ matrix.engine }}
          path: qa/
          retention-days: 7
