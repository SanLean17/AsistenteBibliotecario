name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'server/**'
      - 'app.html'
      - 'index.html'
      - '*.css'
      - 'assets/**'
      - 'vendor/**'
      - 'package.json'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'server/**'
      - 'app.html'
      - 'index.html'
      - '*.css'
      - 'assets/**'
      - 'vendor/**'
      - 'package.json'
      - '.github/workflows/tests.yml'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find src scripts server tests -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Check repository integrity
        run: npm run check
      - name: Run logic tests
        run: npm test
  notices-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check pilot readiness and diagnostics
        run: npm run test:pilot-browser
        env:
          BROWSER_CHANNEL: chromium
      - name: Check notices interactions and responsive themes
        run: npm run test:notices-browser
        env:
          BROWSER_CHANNEL: chromium
      - name: Check daily circulation desk
        run: npm run test:desk-browser
        env:
          BROWSER_CHANNEL: chromium
      - name: Check teacher and reader experience
        run: npm run test:reader-browser
        env:
          BROWSER_CHANNEL: chromium
      - name: Check collection, inventory, migration and copy identity
        run: |
          node tests/collection-planning-browser.cjs
          node tests/inventory-dual-browser.cjs
          node tests/migration-browser.cjs
          node tests/holding-identity-browser.cjs
        env:
          BROWSER_CHANNEL: chromium
