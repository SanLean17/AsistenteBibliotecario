name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check sw.js && find src scripts server tests -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Check repository integrity
        run: npm run check
      - name: Run logic tests
        run: npm test
  browser:
    name: Browser smoke, field pilot, compatibility and OCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Cache pinned Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.1-all-ubuntu
      - name: Install browsers and system dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser smoke — routes, accessibility, volume and recovery
        run: npm run test:browser-smoke
        env:
          BROWSER_CHANNEL: chromium
      - name: Browser workflows — roles, circulation, cataloging and pilot
        run: npm run test:browser-flows
        env:
          BROWSER_CHANNEL: chromium
      - name: Pedagogical workflows, privacy, migration and responsive
        run: npm run test:pedagogical-browser
        env:
          BROWSER_CHANNEL: chromium
      - name: Hemeroteca — magazines, newspapers, articles and containing issue reservations
        run: npm run test:hemeroteca-browser
        env:
          BROWSER_CHANNEL: chromium
      - name: Institutional analytics, history, privacy and exports
        run: npm run test:analytics-browser
        env:
          BROWSER_CHANNEL: chromium
      - name: Institutional administration, annual cycle, substitution, migration and mobile
        run: npm run test:institutional-browser
        env:
          BROWSER_CHANNEL: chromium
      - name: Local OCR engine and cancellation
        run: npm run test:browser-ocr
        env:
          BROWSER_CHANNEL: chromium
      - name: Field pilot — offline, volume, school and recovery
        run: npm run test:browser-field
        env:
          BROWSER_CHANNEL: chromium
      - name: Firefox compact compatibility
        run: node scripts/test-browser.mjs compatibility
        env:
          TEST_ENGINE: firefox
      - name: WebKit compact compatibility
        run: node scripts/test-browser.mjs compatibility
        env:
          TEST_ENGINE: webkit
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-pilot-evidence
          path: qa/
          retention-days: 7
